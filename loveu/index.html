<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sofer calculator ni minji</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator-container {
            background: linear-gradient(145deg, #2d3561, #1a1f3a);
            border-radius: 30px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 40px rgba(100, 100, 255, 0.2);
            padding: 30px;
            width: 380px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-50px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .display-container {
            background: linear-gradient(180deg, #0f1729 0%, #1a2847 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 0, 0, 0.4);
        }

        .display-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        
        .expression {
            background: #0a0e1a;
            color: #ffffff; 
            font-size: 1.5em;
            padding: 12px;
            border-radius: 8px;
            text-align: right;
            min-height: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        
        .result {
            background: #0a0e1a;
            color: #ffffff; 
            font-size: 1.1em;
            padding: 15px;
            border-radius: 8px;
            text-align: right;
            min-height: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 22px;
            font-size: 1.6em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .number { background: linear-gradient(145deg, #3d4563, #2a2f48); color: #e0e0e0; border: 1px solid rgba(255, 255, 255, 0.15); }
        .operator { background: linear-gradient(145deg, #667eea, #5568d3); }
        .equals { background: linear-gradient(145deg, #ff6b6b, #ee5a52); grid-column: span 2; }
        .clear { background: linear-gradient(145deg, #ffa502, #ff8c00); grid-column: span 2; }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="display-container">
            <div class="display-row">
                <div class="expression" id="expression">0</div>
                <div class="result" id="result"></div>
            </div>
        </div>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendOperator('/')">/</button>
            <button class="operator" onclick="appendOperator('*')">x</button>
            
            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('-')">-</button>
            
            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('+')">+</button>
            
            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendNumber('.')">.</button>
            
            <button class="number" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let expressionDisplay = document.getElementById('expression');
        let resultDisplay = document.getElementById('result');
        let currentValue = '0';
        let previousValue = '';
        let operator = null;
        let shouldResetDisplay = false;

        function updateDisplay() {
            expressionDisplay.textContent = currentValue;
            resultDisplay.textContent = '';
        }

        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentValue = num;
                shouldResetDisplay = false;
            } else {
                if (currentValue === '0' && num !== '.') {
                    currentValue = num;
                } else if (num === '.' && currentValue.includes('.')) {
                    return;
                } else {
                    currentValue += num;
                }
            }
            expressionDisplay.textContent = operator ? `${previousValue} ${operator === '*' ? 'x' : operator} ${currentValue}` : currentValue;
        }

        window.appendOperator = function(op) {
            if (operator !== null && !shouldResetDisplay) calculate();
            previousValue = currentValue;
            operator = op;
            shouldResetDisplay = true;
            expressionDisplay.textContent = `${previousValue} ${op === '*' ? 'x' : op}`;
        }

        function calculate() {
            if (operator === null || shouldResetDisplay) return;
            let result;
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);
            
            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = current !== 0 ? prev / current : "Error"; break;
                default: return;
            }

            expressionDisplay.textContent = `${previousValue} ${operator === '*' ? 'x' : operator} ${current} =`;
            resultDisplay.textContent = `pautang ${result}`;
            currentValue = result.toString();
            operator = null;
            shouldResetDisplay = true;
        }

        function clearDisplay() {
            currentValue = '0';
            previousValue = '';
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }
    </script>
</body>
</html>
